  # Manifold vault's own subject taxonomy character for character (accents,
  # capitalisation). They are NOT verified against the vault - the build phase
  # has no vault access. Correct this list before the first integration run.
  #
  # The first eight entries are zanza.tv's own subject sections, verified
  # against the live site in September 2026. The rest are the usual school
  # subjects, kept so that sources from other providers land somewhere sane.
  #
  # If the vault names a subject differently (say "Nyelvtan" where zanza.tv
  # says "Magyar nyelv"), change the alias target below - the alias table is
  # the single place where that mapping lives.
  taxonomy:
    - "Történelem"
    - "Irodalom"
    - "Magyar nyelv"
    - "Matematika"
    - "Filozófia"
    - "Etika"
    - "Társadalomismeret"
