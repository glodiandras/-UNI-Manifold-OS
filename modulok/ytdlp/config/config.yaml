# =============================================================================
# Multimedia Source Pipeline - central configuration
# =============================================================================
# Every path is either absolute or relative to the project root (the directory
# that contains this config/ folder). Nothing is hardcoded in the source.
#
# Override on the command line with:  --config path/to/other.yaml
# or with the environment variable:   MSP_CONFIG=path/to/other.yaml
# =============================================================================

# Root of the staging tree. This is NOT the production Obsidian vault.
output_root: "./staging"

video:
  # Target resolution. The pipeline always takes the best format at or below
  # this height that the platform actually offers.
  max_height: 1080
  preferred_extension: mp4
  # Download the best video and the best audio stream separately and mux them
  # into one file with FFmpeg. This is what makes 1080p possible at all: above
  # ~360p practically every platform serves video and audio as separate DASH
  # streams, and a pre-muxed (progressive) file simply does not exist there.
  #
  # Requires FFmpeg: in Manifold-OS 2.0 the pinned static build under runtime/ffmpeg/ (bin/mos runtime fetch ffmpeg).
  # 'download.py --check' shows which one is used.
  #
  # Set to false to go back to single-file downloads without FFmpeg; expect
  # 360p from YouTube-hosted videos in that case.
  allow_merge: true
  merge_output_format: mp4
  # Optional explicit yt-dlp format selector. null => derived from the settings
  # above as:
  #   bestvideo[height<=H][ext=EXT]+bestaudio[ext=m4a] / bestvideo[height<=H]+bestaudio
  #   / best[height<=H][ext=EXT] / best[height<=H] / best
  # With allow_merge: false a selector that would need merging is rejected.
  format_selector: null

metadata:
  save_json: true
  # Recorded as the content language when the provider reports none (many
  # YouTube videos do not). Leave null to keep "language: null" - an honest
  # "not reported". Setting it, e.g. to "hu", is your assertion about your own
  # corpus; --language overrides it per run.
  default_language: null
  # Also store the complete, unfiltered yt-dlp info dict next to metadata.json
  # as metadata.raw.json. Large (often >100 kB) but occasionally useful when a
  # provider exposes fields the curated schema does not carry.
  save_raw_info: false

transcript:
  # true => every download is transcribed right away. A failure here is a
  # warning, never a failed download: the media and the notes are already on
  # disk and transcribe.py --pending can retry later.
  # Manifold-OS 2.0 port (C20a): false - the transcript (mlx-whisper background in the model worker) is the C20b's job;
  # a staged source stays `pending`. Do not turn this on in the port: the ASR engines here load models on their own.
  enabled: false
  status: pending
  # auto | subtitles | mlx_whisper | faster_whisper | whisper_cpp
  # 'auto' tries them in that order and uses the first available one.
  backend: auto
  # Language given to the ASR engine. "hu" is set explicitly rather than left
  # to auto-detection: Whisper occasionally mistakes short Hungarian openings
  # for another language, and a wrong guess ruins the whole transcript.
  # null => let the engine detect it.
  language: "hu"
  # Fidelity requirement (AI01 #14): never "beautify" a transcript by default.
  # If you enable any post-processing, transcript_postprocessed is set to true
  # in the transcript frontmatter so that a later integration step knows the
  # text is no longer character-exact.
  postprocess: false
  whisper_cpp:
    # Path or command name of the whisper.cpp CLI (whisper-cli / main).
    binary: null
    # Path to a .bin GGML model file.
    model: null
    extra_args: []
  # Apple Silicon GPU backend (pip install -e ".[mlx]"). large-v3-turbo is
  # roughly as fast as a CPU "small" run but far more accurate on Hungarian.
  mlx_whisper:
    model: "mlx-community/whisper-large-v3-turbo"
  # Default ASR. large-v3-turbo is markedly better on Hungarian than the small
  # model (proper nouns, endings) and still runs at roughly half real time on
  # an Apple Silicon CPU with int8. The first run downloads ~1.6 GB.
  faster_whisper:
    model: "large-v3-turbo"
    device: "auto"
    compute_type: "int8"
    # Both settings are what keep a transcript complete; see README section 9.
    vad_filter: true
    condition_on_previous_text: false

subtitles:
  # Provider-supplied subtitles are downloaded as separate files (no FFmpeg
  # needed) and can be turned into a transcript with:
  #   scripts/transcribe.py PATH --backend subtitles
  download: false
  languages: ["hu", "en"]
  # yt-dlp subtitle format preference (no conversion is performed).
  formats: "vtt/srt/best"
  # Machine-generated captions are ASR output, not a human transcript. They are
  # still recorded honestly (transcript_engine says where the text came from).
  include_auto: false

organization:
  provider_folder: true
  subject_folder: true
  # Used when no subject can be determined and none is given with --subject.
  default_subject: "Besorolatlan"
  # extractor key / hostname -> human-readable provider folder name
  provider_names:
    zanza.tv: "Zanza"
    zanza: "Zanza"
    youtube: "YouTube"
    "youtube:tab": "YouTube"
    vimeo: "Vimeo"
    generic: "Web"
    cs50.harvard.edu: "CS50"

