archive:
  # Duplicate protection. Disabling this does not disable the on-disk checks.
  enabled: true
  dir: "./archive"

logging:
  dir: "./logs"
  # DEBUG | INFO | WARNING | ERROR
  level: INFO
  # Machine-readable event stream (logs/events.jsonl) next to the text log.
  json_events: true

playlist:
  # Safety switch (spec section 13): a playlist URL is refused unless the run
  # explicitly asks for playlist mode with --playlist.
  enabled: false
  # Hard stop: a playlist larger than this aborts instead of silently pulling
  # hundreds of videos. Raise per run with --max-items.
  max_items: 50

crawl:
  # download.py --crawl URL: read a listing page (a subject or topic page such
  # as https://zanza.tv/tortenelem), find every video page below it and stage
  # them all as one batch. Already staged pages are neither fetched nor
  # downloaded again, so re-running the same crawl only picks up new videos.
  #
  # The crawler reads robots.txt first and never fetches a disallowed page. It
  # stays on the start page's host and below its path, sends no cookie and no
  # credential, and drops a page that redirects elsewhere (e.g. to a login).
  #
  # Minimum pause between two page requests, in seconds. A longer Crawl-delay
  # in the site's robots.txt always wins (zanza.tv asks for 10).
  delay_seconds: 10
  # Link levels followed below the start page.
  # zanza.tv: subject page (0) -> topic page (1) -> video page (2).
  max_depth: 2
  # Hard stop on pages read: a wrong start page aborts instead of wandering.
  max_pages: 400
  # A crawl that finds more video pages than this aborts. Raise per run with
  # --max-items.
  max_items: 200
  # A page is a video page when its HTML matches one of these regular
  # expressions (an embedded player). Video pages are not crawled further.
  embed_patterns:
    - 'youtube(?:-nocookie)?\.com/embed/[A-Za-z0-9_-]{6,}'
    # a youtu.be short link as an iframe source (a mere <a href="https://youtu.be/…"> on a
    # listing page does NOT make it a video page)
    - '<iframe[^>]+src=["'']?https?://(?:www\.)?youtu\.be/[A-Za-z0-9_-]{6,}'
    # CS50's own player (video.cs50.io/<YouTube id>) on cs50.harvard.edu week pages;
    # the 2.0 discovery (modulok/ytdlp/bejaras.py) maps it to the YouTube video
    - 'video\.cs50\.io/[A-Za-z0-9_-]{6,}'
    - 'player\.vimeo\.com/video/\d+'
    - '<video[\s>]'
  # How the crawler names itself. Keep it honest.
  user_agent: "multimedia-source-pipeline (personal study archive; honours robots.txt)"

download:
  retries: 5
  fragment_retries: 5
  socket_timeout: 30
  # null => no limit. Example: "2M"
  ratelimit: null
  # Resume interrupted downloads instead of restarting them.
  resume: true

ytdlp:
  # Optional path to a local yt-dlp source checkout (e.g. a cloned yt-dlp
  # repository). When set, it is prepended to sys.path, so the pipeline uses
  # that checkout instead of the installed yt-dlp package.
  local_source_path: null
  # Optional path to a yt-dlp CLI binary, used only when the Python module is
  # not importable.
  binary: null
  # Passed through to yt-dlp as --extractor-args.
  #
  # Why the YouTube setting below is the default: educational sites (zanza.tv
  # among them) do not host video themselves, they embed a YouTube player.
  # Several of those videos are published as embed-only - the plain watch page
  # answers "This video is not available", while the embedded player the site
  # itself serves works. Selecting the embedded player client is what makes
  # such a video readable at all; verified against zanza.tv in 2026-09.
  #
  # This is client selection, not a bypass: private, paid, age-gated and DRM
  # protected videos still fail, and no credential or cookie is ever used.
  # If a future yt-dlp release renames a client, empty this mapping ({}) and
  # the pipeline falls back to yt-dlp's own defaults.
  extractor_args:
    youtube:
      player_client: ["web_embedded", "tv", "android", "ios"]
  # JavaScript runtimes yt-dlp may use to solve YouTube's player ("n") challenge.
  # This is not optional for quality: without a runtime YouTube returns the one
  # 360p pre-muxed format and nothing else, no matter what max_height says.
  # yt-dlp enables deno by default, node has to be named explicitly. The first
  # one pinned by Manifold-OS is used (2.0 port: nothing is searched on PATH; deno is not pinned).
  # Requires the yt-dlp-ejs package (a dependency of this project).
  js_runtimes: ["deno", "node"]
  # Path to the ffmpeg binary. "auto" = none: 2.0 port (Javító 3): no MOS_FFMPEG, no PATH, no imageio-ffmpeg, no
  # home-folder binary (~/.local/bin is forbidden); modulok/ytdlp/lanc.py hands in the pinned, sha256-verified
  # [utak] ffmpeg (<os>/runtime/ffmpeg/ffmpeg) for every run.
  ffmpeg_location: auto
  # Path to the pinned node binary for the JS challenge solver. "auto" = none (never searched on PATH; without it
  # YouTube offers only the 360p pre-muxed format). lanc.py hands in [utak] node.
  node_location: auto

integration:
  # Hand-off to the downstream integrator - the owner's decision of 2026-09-19:
  # "Az a lényeg, hogy a ytdlp része legyen, mert ezáltal, ezt összeköthetjük
  # 1 db workflowra (link bemenet -> transcript & videó -> videó, transcript &
  # metadata integrálása a kért programmal)".
  #
  # This pipeline still never reads or writes the vault. After staging, it runs
  # `command` once per source folder that is still 'pending', with {folder}
  # replaced by the folder's absolute path. The command below is the Manifold
  # vault's own integrator: it places the files, writes the source note, links
  # the video to the notes whose content it really carries, verifies, logs, and
  # finally sets integration_status: integrated here. All of that happens under
  # the vault's AI01 Workflow 2.0 protocol, not under this repository's rules.
  #
  # enabled: false  -> only `download.py --integrate` and `integrate.py` hand off.
  # enabled: true   -> every download hands off, unless `--no-integrate`.
  #
  # Owner decision, 2026-09-20: true - one workflow. Since the receiving system
  # decides with a local model and only asks when it is unsure (the answer comes
  # back as integration_status: in_review), an unattended crawl no longer piles
  # up work for the owner: what the model can decide is decided, the rest waits
  # in the vault's own interface.
  # The vault's own tools need numpy, mlx-whisper, mlx-vlm and pypdf; since
  # 2026-09-23 they run from the Manifold-OS venv on the same SSD (everything on
  # the drive, owner's request), where those versions are pinned. -B keeps
  # __pycache__ out of the vault. {project_root} is this repository's root, so
  # both paths are relative to the drive and survive it being mounted elsewhere
  # (the 2026-09-19 and 2026-09-23 moves each broke an absolute path here).
  # Value aligned with the owner decision above on 2026-09-23 (it had been left
  # at false, contradicting the dated decision two paragraphs up).
  # 2026-09-24 (owner decision): this repository now lives inside Manifold-OS
  # (Manifold-OS/modulok/ytdlp), next to the vault's tools (modulok/eszkozok).
  # The hand-off goes through `mos kor --mappa {folder}`: the same vault
  # integrator (media.py auto --staging) runs, but wrapped in Manifold-OS's
  # per-source snapshot, so every hand-off - from the Manifold-pult or from a
  # terminal - can be undone (`mos undo --kor ...`), and two hand-offs never
  # write the vault at the same time (kor lock). This repository still reads
  # and writes nothing outside itself.
  # Manifold-OS 2.0 port (C20a): false. The legacy hand-off ran `bin/mos kor` (the 2.0 has no `kor`); the video chain
  # hand-off into the vault is the C20b's job (the gépi-írás `mozgat` operation). The staged source stays `pending`.
  enabled: false
  command: []
  timeout_seconds: 3600
