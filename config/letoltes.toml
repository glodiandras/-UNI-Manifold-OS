# Manifold-OS 2.0 — modelljelöltek letöltési listája (C04, 2026-09-30).
#
# Csak adat: a letöltést és a regiszterbe vételt a C05 (modellgazda) végzi, a felhasználó
# jóváhagyása után (D3: név- és mérettel ellátott lista, igen, utána offline). A cél a {models}
# (HF_HOME). Indoklás, források, kizárt jelöltek: docs/MODELL-JELOLTEK.md.
#
# Mezők:
#   repo              HF-repó (a letöltés forrása)
#   feladat           ocr_kezi | ocr_keplet | atirat | szoveg | matek | matek_ellenorzo |
#                     beagyazas | rerank | osztalyozas | kod (C36b)
#   minta             ha nem a teljes repó kell (allow_patterns); hiányában az egész repó
#   meret_gb          a letöltendő fájlok összege a HF API szerint (2026-09-30), GB = 10^9 bájt
#   csucs_gb          becsült csúcs-RAM: 1,1 × súlyok + 0,8 GB (a legacy három mérésére illesztve);
#                     a meglévőknél a mért érték (calibration.json, 2026-09-23), ott csucs_mert = true
#   keret             munka (≤ 5 GB) | tavol (≤ 9 GB)
#   futtato           a betöltő könyvtár: mlx-lm | mlx-vlm | mlx-whisper | mlx-audio | transformers |
#                     sentence-transformers | faster-whisper | mlx-embeddings | onnxruntime
#                     (az utolsó kettő nincs a config/requirements.lock-ban)
#   konvertalas       true: a repó nem MLX-formátumú; a letöltés után helyi konvertálás kell (C05)
#   licenc            a modellkártya szerint
#   kor               elso (ajánlott első kör) | opcionalis
#   megvan            true: már a {models} alatt van (a C02 klónja), nem kell letölteni

