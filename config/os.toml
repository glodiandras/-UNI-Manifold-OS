# ------------------------------------------------------------------ felkészültség-becslés és dolgozat-oldal (C28a; docs/C28-TERV.md)
# A számot kód számolja (kártya-felidézés, kvíz, frissesség, tanult idő), a súlyok **kalibrálatlan induló értékek**: a C28b
# illeszti őket a valódi dolgozat-eredményekre. Mért tudás (kártya vagy kvíz) nélkül nincs szám.
[felkeszultseg]
elore_nap = 60                       # ennyi napra előre listázza a közelgő dolgozatokat
mult_nap = 3                         # ennyi napig mutatja a már lezárt dolgozatot
ablak_nap = 21                       # a tanult idő és a kvíz ablaka a dolgozat előtt (nap)
suly_kartya = 0.40                   # az összetevők súlya (az összegük nem kell 1 legyen: a számolt összetevőkön újranormálódnak)
suly_kviz = 0.35
suly_frissesseg = 0.10
suly_ido = 0.15
min_bizonyitek = 0.15                # wK·cK + wQ·cQ ennyi alatt nincs szám („nincs mért tudás”)
kartya_n0 = 5                        # ennyi kártyától teljes a kártya-bizalom
kviz_n0 = 10                         # ennyi (időben csökkentett) kvízkérdéstől teljes a kvíz-bizalom
kviz_felezes_nap = 14                # a kvízeredmény súlya ennyi nap alatt felére csökken
felezes_nap = 10                     # a frissesség felezési ideje az utolsó tanulás óta (nap)
cel_perc = 60                        # ennyi tanult perctől teljes az idő-összetevő (témánként)
min_tanulas_mp = 60                  # ennyi aktív másodperc alatt a nap nem számít tanulásnak az utolsó tanulás számításában
jo = 0.80                            # e fölött „jó”
gyenge = 0.60                        # e alatt „gyenge” (a gyenge pontok küszöbe)
cel = 0.85                           # a napi terv célszintje témánként
napi_perc = 45                       # a napi terv egy napra jutó ideje
szelet_perc = 15                     # a napi terv szeletei
max_terv_nap = 21                    # legfeljebb ennyi nappal előre tervez
gyenge_kartya_db = 5                 # témánként ennyi leggyengébb kártyát mutat
atnevezes_kovetes = true             # a tracker tanult idejét az átnevezés előtti útvonalakról is összeadja (git-ből, olvasáskor)
kalibralt = false                    # a `bin/mos felkeszultseg kalibral --rogzit` írja át (C28b), ha a súlyokat a valódi eredményekre illesztette
kalibracio_min = 8                   # ennyi kalibrációs pont (lezárt dolgozat eredménnyel ÉS mért tudással a D−N. napon) alatt a súlyok nem változnak
kalibracio_elotte_nap = 3            # a kalibrációs pont becslése a dolgozat előtti D−N. nap végére rekonstruált állapot (a kilátás)
kalibracio_vissza_nap = 400          # ennyi napra visszamenőleg keres lezárt dolgozatot a kalibrációhoz
kalibracio_ridge = 0.1               # az illesztés húzása az induló súlyok felé (λ·‖w − w₀‖²)

# ------------------------------------------------------------------ kártyák és FSRS (C23a; docs/C23-TERV.md)
# A kártya a vaultban él (kísérőjegyzet, `> [!card]` callout, `^c-…` azonosító), az ütemezés állapota a {tanulas_db}-ben,
# az azonosítóhoz kötve. Az FSRS a py-fsrs (D3: jóváhagyva), a paraméterei az alapértékek.
[kartya]
mappa = "Manifold - Cards"           # a kísérőjegyzetek lapos mappája; a szállított alap (`<kisero_elotag>Cards`) a `[vault] kisero_elotag`-ot követi, bármi más kifejezett felülírás (core/kiserok.py); a sémaosztály ebből származik
utotag = " — kártyák"                # a kísérőjegyzet neve: <forrás alapneve><utotag>.md
megtartas = 0.9                      # desired_retention
max_intervallum_nap = 36500
tanulasi_lepesek = ["1m", "10m"]     # learning_steps (s | m | h | d)
ujratanulasi_lepesek = ["10m"]       # relearning_steps
fuzz = true                          # az intervallum kis véletlen szórása (a tesztek kikapcsolják)
uj_naponta = 20                      # új kártya naponta (a „Mai ismétlés” limitje)
nap_kezdete_ora = 4                  # a nap fordulója helyi időben (az Anki 4 órás fordulója)
torles_max = 50                      # egy szinkron legfeljebb ennyi kártyát jelöl töröltnek (védelem a hibás olvasás ellen)

# AI-generálás a kapukkal (C23b; modulok/kartya/generalas.py, docs/C23-TERV.md 5.): a mennyiség a jegyzet sűrűségéből
[kartya.generalas]
max_kartya = 30                      # jegyzetenként legfeljebb (kézi „Kártyák ebből”)
auto_max_kartya = 10                 # az automatikus mód jegyzetenként és körönként legfeljebb ennyit (a koordinátor döntése, 2026-10-08)
suruseg = 0.5                        # tényes mondatonként ennyi kártya
vak_kuszob = 0.5                     # vak önellenőrzés: a modell válasza a kártya válaszának tövei közül legalább ennyit fed
duplikat_jaccard = 0.8               # karakter-3gram Jaccard a meglévő, a törölt és az elfogadott kártyák kérdéseire

# CX-011: történeti beállítások. A `be` kulcsot a core nem olvassa: a kártya automatikus fogyasztója 80(a) óta feltétel nélkül nincs
# regisztrálva (`core/automatika.alap_fogyasztok`), és a feladatsor az automatikus típust el is utasítja; a többi kulcs csak a mérőeszközöké.
[kartya.automatika]
be = false                           # történeti, nem olvasott: 80(a) AI csak gombra — a kártya nem indul magától, `true`-ra sem (CX-011); a „Kártyák ebből” kézi parancs marad
kuszob = 0.2                         # „erősen módosult”: hosszal súlyozott mondathalmaz-Jaccard-távolság (C23b mérése: +30% új szakasz 0,23–0,26; 3 elgépelés 0; 1 mondat ≤ 0,08; a jóváhagyás: K305)
uj_karakter = 600                    # vagy ennyi karakternyi új mondat
csend_perc = 10
min_hossz = 400                      # az új jegyzet legalább ennyi karakter (tisztított mondatok)
koteg = 3                            # egy automatikus feladat legfeljebb ennyi jegyzetet visz

# ------------------------------------------------------------------ közös forráshűség-kapu (C22a; docs/C22-TERV.md, docs/C22-KAPU-MERES.md)
# Egy kapu a kvíznek, a kártyának, a vault-válasznak és az összefoglalónak (modulok/kapuk). A küszöböket a
# `bin/mos kapu meres` méri a C18 `szoveg` halmazán (2026-10-04, arany v1-vázlat: pozitívok ≥ 91,8%, rontások makró 97,8%
# elutasítva; docs/C22-KAPU-MERES.md); a `[kapuk.<fogyasztó>]` felülírhatja (ma a hossz-határokat).
[kapuk]
idezet_kuszob = 0.85                 # az idézet hasonlósága a forráshoz (1,0: szó szerint)
tamogatas_kuszob = 0.5               # az állítás tartalmi töveinek aránya a bizonyítékban
bizonyitek = "mondat+cim"            # idezet | mondat | mondat+cim: amihez az állítást mérjük
kenyes = true                        # a számok és tulajdonnevek az állításban a bizonyítékban is állnak
