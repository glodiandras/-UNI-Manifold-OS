idezet_max_karakter = 420            # a jegyzetben mutatott forrásmondat legfeljebb ennyi karakter
duplikat_jaccard = 0.6
mappa_max_per_jegyzet = 3            # mappa-szint: egy jegyzetből legfeljebb ennyi állítás
mappa_allitas_max = 10
mappa_max_jegyzet = 40               # mappa-szint (C26b): legfeljebb ennyi jegyzet-összefoglaló kerül a modell elé
mappa_max_uj = 4                     # mappa-szint (C26b): egy kérésben a hiányzó jegyzet-összefoglalókból ennyit készít el (+ a mappa-szint = legfeljebb 5 gépi írás)
gyorsitotar_ora = 12                 # (C26b) a modell-válaszok gyorsítótára a {tmp} alatt: az elakadt írás újrapróbája nem hívja újra a modellt
kontextus_max_karakter = 24000       # a külső AI-nak szánt kontextus-csomag mérete
ablak_mp = 60                        # videó-szint: az átirat időablaka

# Automatikus mód döntései (tiszta függvények; az ütemező a C23b, a memóriaőr a Kapu.admit). A küszöböt a C23b méri.
[osszefoglalas.automatika]
be = false                           # történeti, nem olvasott: 80(a) AI csak gombra — az összefoglaló nem indul magától, `true`-ra sem (CX-011); a kézi parancsok maradnak
