bejovo_max_gb = 20                   # C20b: egy behúzott videó legfeljebb ekkora (a feltöltés darabolva, POST /api/video/bejovo)

# 84. döntés (javasolt kiegészítés, 2026-10-14): a bejárt videóoldal közvetlen videófájlja (`<a href="….mp4">`) a beágyazott lejátszó
# helyett (modulok/ytdlp/kozvetlen.py). A minőség-jelölő a fájlnév egy szakasza (`lecture1-1080p.mp4`); a nyelvi útszakasz (`/es/`, `/pt/`)
# az oldal nyelvétől (`<html lang>`) eltérve szinkron, kimarad. Megfelelő fájl nélkül a beágyazott lejátszó marad.
[video.kozvetlen]
