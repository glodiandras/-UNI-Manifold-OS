mappa = "Manifold - Summaries"       # a kísérőjegyzetek lapos mappája; a szállított alap (`<kisero_elotag>Summaries`) a `[vault] kisero_elotag`-ot követi (core/kiserok.py); a sémaosztály ebből származik
