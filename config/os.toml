# ------------------------------------------------------------------ C++ munkafelület (C36a; modulok/cpp, modulok/homokozo/program.py)
# A fordítás és a futtatás külön `sandbox-exec` profil alatt fut (profil_fordit.sb, profil_futtat.sb): a lefordított program
# a homokozón kívül sehol nem fut. Az idő a szülőben kemény korlát (SIGKILL a folyamatcsoportra) + RLIMIT_CPU háló; a memóriát
# a szülő `mintavetel_ms`-onként olvassa (phys_footprint; T059: `setrlimit` macOS-en nem korlátoz).
[cpp]
std = "c++17"
gyors = ["-O2", "-Wall", "-Wextra"]
# A hibakereső mód: az -O1 a sanitizerek ajánlott szintje; az első hiba megállítja a programot (-fno-sanitize-recover).
