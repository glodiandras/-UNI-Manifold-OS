# ------------------------------------------------------------------ CAS-homokozó (C24a; modulok/homokozo)
# A SymPy-számítás külön folyamatban, `sandbox-exec` profil alatt (fájl, hálózat, exec, fork tiltva). Az idő
# feladatonként: puha korlát a gyermekben (`setitimer`), kemény a szülőben (SIGKILL a folyamatcsoportra). A memória:
# a szülő `mintavetel_ms`-onként olvassa a gyermek phys_footprint-jét, és a korlát fölött SIGKILL (T059: a
# `setrlimit` macOS-en ValueError). A mintavétel közti foglalás a korlátot túllépheti (mérve 2026-10-04: egy
# 800 MB-os lista ~60 ms alatt jön létre). Alapállapotban a gyermek ~70 MB; egy indítás ~0,9 s (a SymPy importja).
[homokozo]
idokorlat_s = 10.0                   # egy feladat (kód vagy hívás) felső ideje
lepes_idokorlat_s = 3.0              # a levezetés egy sorának megoldáshalmaza; túllépve: „nem eldönthető”
memoria_mb = 768
mintavetel_ms = 20
kimenet_max_kb = 256                 # egy feladat válasza a protokoll-csatornán; fölötte ölés
indulas_s = 20.0                     # a gyermek kézfogásáig (SymPy-import)
max_ujrainditas = 50                 # egy hívásban ennyi leállított gyermek után a többi feladat homokozo_hiba

