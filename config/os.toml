eredeti_megtart = true               # a konvertálás előtti eredeti az archive/ alá költözik (nem törlünk); false: marad a staging-ben `.eredeti` néven
konvertalas_crf = 20                 # a libx264 minőség (alacsonyabb = jobb); a remux (-c copy) nem kódol újra
konvertalas_szal = 2                 # a kódolás szálai: az app használata mellett is használható marad
