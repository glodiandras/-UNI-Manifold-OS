figyelo_indulasi_szunet_mp = 300       # történeti kulcs, a core nem olvassa (80(a), 80(h)): a figyelő nem indul; D8: az indulás után ennyi ideig nem nézett volna
figyelo_periodus_mp = 60               # történeti kulcs, a core nem olvassa: a figyelt mappák stat-ellenőrzésének gyakorisága volt
figyelo_nyugalom_mp = 30               # történeti kulcs, a core nem olvassa: a legutóbb módosult fotó ennyi ideig állt volna (a másolás befejeződjön)

