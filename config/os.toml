# Manifold-OS 2.0 konfiguráció — a szállított (S) réteg (F3-DESIGN §2).
#
# Semmi nincs beégetve: minden út helyőrzős, a feloldás futásidőben történik (LEGACY-SZERZODESEK L49).
#   {os}   a Manifold-OS gyökere — a csomag saját helyéből számolva (a MOS_ROOT felülírja)
#   {home} a felhasználó saját mappája
#   {workspace_id} a munkatér azonosítója (a `workspace.toml`-ból; nem [utak] kulcs)
#   bármely [utak] kulcs, pl. {work}, {var}
# Minden [utak] kulcs felülírható környezeti változóval: MOS_<KULCS> (pl. MOS_VAULT);
# a konfigfájlt a MOS_CONFIG jelöli ki.
# Az alábbi alapértékek a hordozható (v2) elrendezésé; a termék különbségei az [elrendezes.termek] alatt. Fölöttük a
# telepítési réteg ({install}/settings.toml, presetekkel) és a munkatér rétege ({workspace}/workspace.toml) — mindkettő csak a
# `core/config.RETEG_JOG` engedélylistáján szereplő kulcsokat állíthatja.

[utak]
work    = "{os}/.."                  # az SSD gyökere (Work)
# vault: nincs alapértéke — a MOS_VAULT vagy a telepítési réteg [utak] vault kulcsa adja (`bin/mos portable init --vault …`);
# csak a core ír bele. Nélküle a vaultra épülő kulcsok halasztottak (első használatkor ConfigError, kod: nincs_vault).
workspace = "{vault}/.manifold"      # a vault saját beállításai (workspace.toml); hordozható módban csak olvasva, ha létezik
modulok = "{os}/modulok"
runtime = "{os}/runtime"             # hordozható Python, uv, Node, wheelhouse (gitignore)
var     = "{os}/var"                 # állapot, modellek, indexek (gitignore, Spotlight-kizárt)
install = "{var}"                    # gépenként egy (modellek, kalibráció, zárak, regiszter, mentések gyökere); hordozható módban = {var}
install_run = "{install}/run"        # a gépszintű zárak és pidfájlok (worker)
install_state = "{install}/state"    # a gépszintű állapot (modellzár)
install_logs = "{install}/runs"      # a gépszintű naplók (worker)
state   = "{var}/state"
models  = "{install}/models"         # HF_HOME
venv    = "{install}/venv"
cache   = "{install}/cache"          # minden gyorsítótár (uv, pip) — a home alatt soha
tmp     = "{var}/tmp"                # a vault kötetén (APFS) → atomi os.replace
runs    = "{var}/runs"               # kör-riportok, feladatnaplók (L52–L53)
run     = "{var}/run"                # zárfájlok (kor.lock, L17)
szemelyes = "{var}/szemelyes"        # a személyes adatréteg (L56)
ytdlp   = "{modulok}/ytdlp"          # a ytdlp-lánc munkafája (C20)
vault_git = "{var}/vault.git"        # a vault pillanatkép-tárolója (L01)
ytdlp_git = "{var}/ytdlp.git"
staging = "{ytdlp}/staging"          # a videólánc staging-ja (C20a): szolgáltató/tárgy/cím/{video, metaadat, source.md, …}; gitignore-olt
ytdlp_archivum = "{ytdlp}/archive"   # a letöltési archívum (duplikátum-védelem: downloaded.txt, index.json); gitignore-olt
video_jobs = "{state}/Manifold-media/jobs"   # a médiajobok állapota (state.json; L51); a mappanév az állapot-kompatibilitás miatt rögzített
video_eredeti = "{archive}/video-eredeti"    # a konvertálás előtti eredeti (nem törlünk: archive/ alá, indokkal)
video_visszavont = "{archive}/video-visszavont"   # C20b: a visszavont tétel vaultbeli videó-klónja (nem törlünk: archive/ alá, indokkal)
apkg_visszavont = "{archive}/apkg-visszavont"     # 83: a visszavont `.apkg`-import vaultbeli médiája (nem törlünk: archive/ alá, indokkal)
video_bejovo = "{var}/video/bejovo"   # C20b: a Bevitel szakaszba behúzott videók beérkező mappája (a `video_integralas` innen veszi át)
binaris_naplo = "{state}/binaris-naplo.jsonl"  # a bináris mozgásnapló (L19)
fuzet   = "{state}/Manifold-fuzet"   # a füzetlánc munkamappája (L36; C21): allapot.json, naplo.jsonl, a modell válaszai, az OCR-szöveg (a vaulton kívül, I33)
fuzet_bejovo = "{var}/fuzet/bejovo"  # a felületen behúzott füzetfotók beérkező mappája (C21): mindig figyelt mappa
ffmpeg = "{runtime}/ffmpeg/ffmpeg"   # a pinelt statikus build (bin/mos runtime fetch ffmpeg); a home-beli (~/.local/bin) és a PATH-os tiltott
node = "{runtime}/node/bin/node"     # a yt-dlp JS-kihívás megoldójának futtatója (yt-dlp-ejs)
feladatok_db = "{var}/feladatok.sqlite"   # a tartós feladatsor (C03)
router_db = "{install}/router.sqlite"     # kalibrációs tábla és hő-alapszintek (C05)
tanulas_db = "{var}/tanulas.sqlite"     # kártyák FSRS-állapota és válasznaplója, később a kvíz (C23a, C22); a belső mentésben
automatika_db = "{var}/automatika.sqlite"   # a közös automatika-ütemező állapota (C23b, T149); a belső mentésben
index   = "{var}/index"               # a vault-index (C06): vault.sqlite — újraépíthető a vaultból
app_dist = "{os}/app/dist"           # a felület lefordított csomagja; a core szolgálja ki (egy origin)
vault_kepek = "{var}/cache/vault-kepek"   # kicsinyített vault-képek (C11a, L55): a `/media?w=` gyorsítótára, bármikor törölhető
felulet = "{state}/felulet.json"     # a felület tartós állapota (C07): téma, elrendezés, legutóbbiak
naptar_seged = "{os}/Manifold.app/Contents/MacOS/Manifold"   # az EventKit-segéd (C29): a héj CLI-módja, a `--naptar` kapcsolóval
hej_cli = "{os}/Manifold.app/Contents/MacOS/Manifold"   # a héj futtathatójának CLI-módja a nem naptári parancsokhoz (`--kuka`, CX-004); ugyanaz a bináris, mint a `naptar_seged` (32(a)), de külön kulcs, hogy a `MOS_NAPTAR_SEGED` ál-segédje (tesztek) ne vigye magával a Kukát; a `MOS_HEJ_CLI` felülírja
sandbox_exec = "/usr/bin/sandbox-exec"   # a CAS-homokozó elzárása (C24a): a macOS része; hiányában a homokozó nem fut
llvm    = "{runtime}/llvm"           # a hordozható LLVM (clang++, clangd, clang-format): a C++ munkafelület eszközlánca (C36a); bin/mos cpp telepit
sdk     = "{runtime}/sdk"            # a macOS SDK egyszeri másolata (C36a): a sysroot; a rendszer fordítója és SDK-ja nem használt
archive = "{os}/archive"
backup_gyoker = "{install}/backups"  # a mentések gépszintű gyökere (termékben munkaterenként {backup_gyoker}/{workspace_id})
backup  = "{home}/Manifold-backup"   # a BELSŐ lemezen: szövegmentés SSD-hiba ellen

# ------------------------------------------------------------------ elrendezés (F3)
# A termék (`*.app/Contents/Resources/manifold`) különbségei a fenti, hordozható alapértékekhez képest: betöltéskor
# mélyegyesítéssel, a rétegek előtt. A kódfa ({os}) a termékben csak olvasható (I1: írható út nem mutathat bele).
[elrendezes.termek.utak]
work    = "{vault}/.."
var     = "{workspace}/var"          # a regiszter `allapot = "telepites"`-e: {install}/workspaces/{workspace_id}/var
install = "{home}/Library/Application Support/Manifold"
install_logs = "{install}/logs"
venv    = "{os}/runtime/venv"
backup  = "{backup_gyoker}/{workspace_id}"
ytdlp   = "{var}/ytdlp"
archive = "{var}/archive"
naptar_seged = "{os}/../../MacOS/Manifold"
hej_cli = "{os}/../../MacOS/Manifold"
llvm    = "{install}/toolchains/llvm"
sdk     = "{install}/toolchains/sdk"

[elrendezes.termek.pillanat.vault]
kivetelek = "{workspace}/pillanat-kivetelek.json"   # hiányzó fájl = nincs kivétel

[elrendezes.termek.sema]
vault = "{workspace}/schema.json"

[core]
port = 0                             # 0 = szabad port; a héj a kézfogásból tudja meg (a `MOS_CORE_PORT` felülírja)
mentetlen_turelem_mp = 15            # a WS-kapcsolat bontása után ennyi ideig marad a mentetlen-halmaz (a gép nem ír bele; C29.7b)
kor_zar_turelem_mp = 3.0             # a felhasználói visszavonás/visszaállítás/átnevezés ennyit vár a foglalt kör-zárra (a kör végi bundle, 34.), utána 409
naplo_max_mb = 20                    # a futó `{runs}/core.log` méretplafonja: elérésekor forog (core.log.1 … .5), a faulthandler az új fájlra áll
kezelo_idokorlat_mp = 30             # egy kapcsolat egy socket-művelete (olvasás/írás) legfeljebb ennyit vár (T003; a WS a felépülés után korlátlan); a rendezett leállás ennél tovább (35 s) vár a kérésekre
leallas_fokozas_mp = 20              # a héj kilépése (stdin-zárás) után ennyi múlva a még futó feladat azonnal leáll (a tétel vége helyett)

[vault]
kor_zar_varakozas_mp = 2.0           # az ütközés-felülírás (`felulir`) ennyit vár a kör-zárra, utána 423 (C29.7b, T116)
kisero_elotag = "Manifold - "        # a kísérőjegyzet-mappák (kártya, kvíz, összefoglaló, fotó, videó) névelőtagja (`Manifold - Cards`, `Manifold - Quizzes`, …): az ilyen mappák jegyzetei nem tartalmi jegyzetek. EGYETLEN FORRÁS: `core/kiserok.py`; az alábbi `mappa` kulcsok szállított alapértéke ebből képződik (az alap értékű kulcs követi az előtagot)
proba_klon_max_nap = 7               # a gépi írás D9-próbaklónjai ({tmp}/proba/<kör>/, a vault APFS-klónja) ennyi nap után törlődnek egy új próbakör előtt (0: soha)

# ------------------------------------------------------------------ pillanatképek (L01–L18)
# Külső git-könyvtár: a munkafába NEM kerül .git. Csak szöveg kerül be; a bináris médiát a
# move-napló követi. A tároló saját info/exclude-ja a `kizar` listából generálódik.

[pillanat.vault]
munkafa = "{vault}"
git_dir = "{vault_git}"
kivetelek = "{os}/config/pillanat-kivetelek-vault.json"   # korábbi kevert commitok védett gazdai útjai (L16)
kizar = [
  ".DS_Store", "._*", ".trash/", ".manifold/",
  ".obsidian/workspace*.json", ".obsidian/cache",
  "__pycache__/", "*.pyc",
  "*.manifold-tmp",
]
# A bináris (média-, dokumentum-) mintákat a `core/mediatipus.py` adja minden tárolóhoz, kis- és nagybetűvel (C20a, T142):
# a pillanatkép kizárólistája és a média-engedélylista így egy forrásból jön (`snapshot.repos`).

[pillanat.ytdlp]
munkafa = "{ytdlp}"
git_dir = "{ytdlp_git}"
# A projekt saját .gitignore-ja is érvényes (média, venv, titkok); ez csak kiegészíti.
kizar = [".DS_Store", "._*", "__pycache__/", "*.pyc", ".pytest_cache/", ".venv.nosync/"]
# a `*.part`, `*.ytdl`, `*.temp`, `*.eredeti` és a médiamintákat a core/mediatipus.py adja (Javító 3, A3-09)

# ------------------------------------------------------------------ vault-séma (C11b, L33–L34)
[sema]
vault = "{os}/config/vault-sema.json"   # EGY VÁLASZTHATÓ helyi sémafájl (mezősorrend, értékkészletek, kivételosztályok); a szállított fában nincs. A feloldási lánc (`core/kiserok.sema_fajl`): ez a fájl, ha létezik → az első megnevezett preset `<nev>.schema.json`-ja → `alap`
alap = "{os}/config/schema-default.json"  # a szállított semleges séma (a lánc vége)
mod = "ki"                           # ki | tanacsado | szigoru: ki = nincs sémaellenőrzés; tanacsado = a sértések tanácsként látszanak (`tanacsok`), semmit nem tiltanak; szigoru = a sértés megerősítést kér, a gépi írás elutasítja

[mentes]
megtartott_bundle = 10               # tárolónként ennyi bundle marad a {backup} alatt (L18); a kódtárból is
megtartott_migracio = 5              # fájlonként ennyi migráció előtti SQLite-másolat marad (33. döntés, C29.7b)
kodtar = "{os}"                      # a 2.0 kódtárának git-munkafája (33. döntés): `git bundle --all` a {backup}/mos-kodtar-*.bundle-be
ido_perc = 30                        # tétlenségben ennyi percenként bundle, ha a HEAD változott (34. döntés); minden gépi kör végén is
allapot_ido_perc = 60                # az állapotmásolat (mos-allapot-*) az időzítőből legfeljebb ennyi percenként; kilépéskor mindig, ha változott
allapot_megtartott = 5               # az állapotmásolatból ennyi legújabb marad …
allapot_napi = 14                    # … és az utolsó ennyi nap mindegyikéből a nap utolsó másolata (a változatlan fájl hard link)
kilepes_turelem_mp = 20              # a kilépési mentés legfeljebb ennyit vár a kör-zárra (egy futó időzített mentés vagy gépi írás végére)

# ------------------------------------------------------------------ teljes külső mentés (80(g), CX-012)
# Verziózott, inkrementális mentés külső kötetre (`bin/mos teljes-mentes ment|ellenoriz|visszaallit`): minden futás új
# időbélyeges változat, a változatlan fájl az előző ellenőrzött változatból hard linkkel (exFAT-on másolat). A modellek,
# a var/venv, a runtime/ és az újraépíthető {index} nincs benne (bin/mos runtime fetch + install, bin/mos models pull;
# az indexet a core építi újra); az átmeneti {tmp}, {cache}, {run}, {runs} és a gyökér rejtett mappái (.claude/) soha.
[teljes_mentes]
megtartott = 10                      # a célmappában ennyi kész változat marad; a régebbi kész változat törlődik
kihagy = ["staging", "archive"]      # [utak]-kulcsok, amelyek nem kerülnek a mentésbe (a videólánc staging-ja ~55 GB, a bevitt videó a vaultban van; az archive/ eredetijei)
cel = ""                             # a lemezfigyelő célmappája a külső köteten (üres: nincs figyelés)
figyelo_be = false                   # true: a futó app a csatlakoztatott célkötetre magától sorba állít egy mentést
figyelo_ora = 24                     # … ha az utolsó ellenőrzött teljes mentés ennél régebbi (óra); az indulási szünet után

# ------------------------------------------------------------------ feladatsor (C03)
[feladatsor]
indulasi_szunet_mp = 180             # a visszatöltött sor csak ennyi után indul (D8: a megnyitás nem indít munkát)
max_parhuzamos = 2                   # egyszerre legfeljebb ennyi feladat; ebből egy modell- és egy vault-író
naplo_max_nap = 60                   # a `{runs}/feladatok/*.log` ennél régebbi példánya induláskor törlődik (az `{runs}/eval` mérési riportjai nem)
naplo_max_db = 500                   # e fölött a legrégebbi (de legalább egy napja álló) naplók törlődnek
max_futas_mp = 21600                 # egy feladat legnagyobb futásideje (6 óra); utána azonnal leáll, `hiba` lesz. 0: nincs korlát

[feladatsor.max_futas_tipus_mp]      # típusonként felülírja a `max_futas_mp`-t (a többi típusé az alap)
mentes = 3600
teljes_mentes = 43200
video_letoltes = 43200
video_integralas = 43200
video_bejaras = 7200

# ------------------------------------------------------------------ vault-index (C06)
# Az index az app megnyitásakor indul (háttérszál, modell nélkül); utána csak a változott fájl olvasódik.
[index]
figyelo = "fsevents"                 # fsevents | lekerdezes (stat-alapú tartalék)
latencia_mp = 0.03                   # az FSEvents gyűjtési ideje
lekerdezes_mp = 2                    # a tartalék figyelő bejárási időköze
max_talalat = 200                    # a keresés és az említések alapkorlátja
regex_idokorlat_mp = 2               # a keresés felhasználói regexeinek együttes időkorlátja (H5); túllépés: 400
bazis_idokeret_mp = 2                # egy Bases-lekérdezés teljes időkerete (T040, C29.8); túllépés: ok=false + hibak; 0: nincs keret
pdf_idokorlat_mp = 300               # C25c: egy PDF szövegkinyerésének felső korlátja a gyermekfolyamatban (a legnagyobb mért: ~9 s)

# ------------------------------------------------------------------ hibrid keresés, „Kérdezz a vaulttól” (C25b-mag; docs/C25B-TERV.md)
# A vektortár a {index}/vektor.sqlite (újraépíthető, a belső mentésbe nem kerül, 33. döntés). Minden érték kalibrálatlan induló
# érték: a valódi vaulton a K160 méri (a `modulok/eval/kereses/hibrid.py` a kereses/parok.json párjain).
[kereses.hibrid]
rrf_k = 60                           # RRF: pont = Σ súly / (k + hely)
lexikai_suly = 1.0
vektor_suly = 1.0
jelolt_n = 100                       # ágonként ennyi jelölt jegyzet
darab_n = 200                        # a vektor-ág ennyi darabot kér
lexikai_jegyzet_darab = 10           # a vault-válasz jelöltjei: a lexikailag legjobb ennyi jegyzet minden darabja
# C25b (2026-10-08; a parok.json 50 párja a vault.git 2ed889c fáján, bge_m3 + bge_reranker_v2_m3; NAPLO C25b):
# recall@1/5/10, MRR — fts .78/.86/.86/.805 · fts+rerank .66/.80/.88/.737 · fts+vektor .66/.82/.90/.739 ·
# fts+vektor+rerank .72/.90/.90/.796; az átfogalmazott kérdéseken fts .55/.70 → .60/.80 (recall@1/@5).
# M12: a vektor+rerank a legjobb vektor nélküli változatnál (fts) +0,04 recall@5 → a vektorindex épül; a reranker csak a
# vektorral együtt javít (egyedül ront), és csak a hibrid módban fut. A ⌘⇧F alapja a lexikai keresés marad (az első
# találat ott jobb: recall@1 .78 vs .72); a „Jelentés szerint” kapcsoló és a „Kérdezz” a hibridet használja.
vektor = true
rerank = true
rerank_n = 20

[kereses.kerdezz]
darab_n = 6                          # ennyi forrás kerül a promptba
min_fedes = 0.34                     # „elég forrás”: a kérdés töveinek ennyi része a darabban …
min_hasonlosag = 0.5                 # … vagy legalább ennyi a koszinusz (vektor-ág mellett)
max_tokens = 700
max_mondat = 8
forras_max_karakter = 1600

# ------------------------------------------------------------------ sablonok, napi jegyzet, „Ma” oldal (C15)
# A formátumok a moment.js részhalmazát használják (core/sablon.py); `[szó]` a szó szerinti szöveg.
[sablon]
mappa = "_Template"                  # a vault sablonmappája (az Obsidian templates.json-jával azonos)
datum = "YYYY-MM-DD"                 # a {{date}} alapformátuma
ido = "HH:mm"                        # a {{time}} alapformátuma
nyelv = "hu"                         # a hónap- és napnevek nyelve: hu | en

[naplo]
# A napi jegyzet vault-relatív útja (kiterjesztés nélkül; moment.js-részhalmaz, a `[szó]` szó szerinti: a `D` és az `a` betű formátum-jel,
# ezért a mappanév zárójelben áll): semleges alap `Daily/ÉÉÉÉ-HH-NN`.
ut = "[Daily]/YYYY-MM-DD"
sablon = "Napi jegyzet"              # ha a sablonmappában van ilyen nevű .md, az a napi jegyzet váza (a beépített helyett)
canvas = "YYYY-MM"                   # a havi canvas neve (L59 szomszédja): a `Canvas:` mező csak létező canvasra mutat
dolgozat_mappa = "Dolgozatok"        # a felkészülési jegyzet mappaneve (L59): <hónap>/Dolgozatok/ÉÉÉÉ-HH-NN - Tantárgy.md
naptar_regi_ora = 36                 # ennyi óra után jelzi a Ma oldal, hogy a naptáradat régi
kiertekelo_nevek = ["Dolgozat kiértékelő", "Dolgozat Napló"]   # a dolgozat-eredményeket tartalmazó jegyzetek névrészletei (C28b; ékezet- és kisbetű-független)

# ------------------------------------------------------------------ naptár és emlékeztetők (C29, 32. döntés)
# A naptár csak olvas; naptáresemény csak a jóváhagyott tanulási blokkból íródik (D12). Az emlékeztetők az Apple
# Emlékeztetők „Manifold” listájába mennek (a jegyzetek `📅` feladataiból); háttérdémon nincs, a szinkron az app
# futása alatt megy. Az EventKit-segéd a Manifold.app csomagjában él (az `[utak]` `naptar_seged` kulcsa).
[naptar]
automatikus = true                   # az app futása alatt magától szinkronizál (az első percek után)
szinkron_perc = 15                   # a naptár olvasásának és az emlékeztetők lehúzásának ritmusa
indulasi_kesleltetes_mp = 60         # az indulás utáni első szinkron előtt ennyit vár (D8)
mult_nap = 120                       # a szinkron ablaka: ma − mult_nap … ma + jovo_nap (L58)
jovo_nap = 180
tanulas_naptar = ""                  # a jóváhagyott tanulási blokk naptára (azonosító vagy név); üres: az első írható „tanulás” kategóriájú

# A naptár kulcsszavas szótára (ékezet nélkül, kisbetűvel; a `core/naptar.py` beépített kategória-, dolgozat- és határidő-szavai
