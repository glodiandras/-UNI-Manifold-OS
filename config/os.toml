kihagyott_szakaszok = ["Füzet", "Gyakorlás", "Kitöltések"]   # gép írta vagy nem tartalmi szakaszok fejezetcímei: a forráshűségi kapu (kártya, kvíz, összefoglaló) nem forrásként olvassa őket; a `[fuzet] szakasz` neve a kódban mindig ide számít

[kapuk.osszefoglalo]
idezet_min_szo = 4
idezet_max_szo = 45

[kapuk.kartya]
idezet_min_szo = 3
idezet_max_szo = 60

[kapuk.kviz]
