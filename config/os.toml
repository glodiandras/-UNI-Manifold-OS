# a videó-bevitel a forrás `targy` mezőjéből ismeri fel a betűt. WORKSPACE-FÜGGŐ, üresen szállítódik.

# ------------------------------------------------------------------ modellgazda (C05)
# A worker-folyamat az EGYETLEN betöltési pont (L22). A négy szabály (L22–L28) értékei a legacy
# calibration.json `helyi_modell` blokkjából, változatlanul (L31: a 2.0-ban a forrás ez a fájl).
# Felülírás: MANIFOLD_MODELL_KERET_GB (keret), MANIFOLD_MODELL_ZAR (a zár útja).
[modellgazda]
port = 0                             # 0 = szabad port; a worker a kézfogásban és a {run}/worker.pid-ben adja
cache_gb = 0.25                      # mx.set_cache_limit — a csúcs ettől kicsi (a 2026-09-23-i 10 GB-os eset)
prefill_lepes = 256                  # darabolt beolvasás (prefill_step_size)
min_szabad_szazalek = 20             # memóriaőr: ez alatt kiürít és vár (kern.memorystatus_level)
tartalek_szazalek = 5                # a visszatöltéshez a küszöb + tartalék + a modell saját része kell
helyreallas_mp = 30                  # ennyi ideig folyamatosan legyen elég szabad memória
zar = "{install_state}/modell.lock"  # gépszintű modellzár (L23); hordozható módban = {state}/modell.lock
probalkozas = 3                      # GPU-memóriahibánál ennyiszer próbálja (L26)
tetlen_urites_perc = 10              # ennyi tétlenség után a modell kiürül
chat_idokorlat_mp = 900              # a chat-kérés válaszának felső korlátja (a kliens; a gondolkodó modell egy tétele ~600 s)
chat_idokorlat_auto_mp = 7200        # … `auto` módban (a worker sorában a tétlenségre is várhat); utána egy óvatos újrapróba, ha a worker tétlen

[keret]
munka = 5.0     # alap: a felhasználó dolgozik mellette
tavol = 9.0     # csak tartós tétlenségben (aktivitas.tavol_perc), vagy a CLI saját workerén (MANIFOLD_MODELL_KERET_GB, M3: a kérés keret-mezője csak szűkít)

# Aktivitásjel (1. / 2. döntés): a felület jele (gépelés, egér → POST /api/aktivitas) és a macOS
# rendszerszintű tétlensége (HIDIdleTime); a frissebb számít.
[aktivitas]
aktiv_mp = 120                       # ennyi időn belüli jel = aktív használat: automatikus munka nem tölt be modellt
tavol_perc = 15                      # ennyi tétlenség után jár a távol-keret
rendszer_tetlenseg = true            # a HIDIdleTime is számít (másik appban gépelés)

# Hőfigyelés (ventilátor nélküli M4). C19 (2026-10-07, docs/MERES-2026-10-07.md): egy futáson belül a token/s az utolsó
# negyedben az első negyed 0,86–1,21-szerese volt (valódi hőesés nem látszott), a küszöb marad; a hamis szüneteket (63 a K28-ban)
# a feladatfüggő sebesség okozta, ezért az alapszint a modell × kontextus-méret osztály szerint áll (core/modell/ho.py).
[ho]
bekapcsolva = true
min_token = 32                       # ennél rövidebb generálás nem minta
alap_minta = 5                       # az alapszint az első ennyi hűvös minta mediánja
ablak = 5                            # a tartós esés: az utolsó ennyi minta mediánja
kuszob = 0.7                         # az alapszint ennyiszerese alatt → hűtési szünet
hutes_mp = 120

# Router (TERV 4.): feladat → az első kalibrált, keretbe férő modell (var/router.sqlite).
# [router.feladat.<név>].tavolra_var: ha a jobb modell csak távol-keretbe fér, várjon-e rá (true),
# vagy fusson a keretbe férő gyengébbel (false, alap).
[router]
feladatok = ["ocr_kezi", "ocr_keplet", "atirat", "szoveg", "kviz", "matek", "matek_ellenorzo",
             "beagyazas", "rerank", "osztalyozas", "fuzet_fejezet", "fuzet_valaszto", "matek_cas", "kod", "grafikon",
             "tema", "kotes", "kiegeszites", "kifejtes", "osszefoglal_kijeloles"]
# C20b: a tema/kotes a médiatársítás két ítélete (modulok/eval/tema, modulok/eval/kotes). J4: az asszisztens két kijelölés-módja
# (⌘J kijelöléssel: kifejtes, ⇧⌘J: osszefoglal_kijeloles) saját aranyhalmazzal; a folytatás a `kiegeszites`-en marad.

[router.feladat.ocr_kezi]
tavolra_var = true                   # a füzet ma a 9B+12B-vel 87/97 — a gyengébbel nem ír a vaultba

# Mérés (`mos eval`, C18.1). Érvényességi kapu: ha a levágott, hurkos, üres vagy hibás tételek aránya
# nagyobb az `ervenyes_kuszob`-nál, az értékelés `ervenyes: false`, és a `--rogzit` nem ír kalibrálható
# sort (a kalibráció a 2026-10-03-i mérésből: NAPLO C18.1). A `[meres.feladat.<f>]` a feladat kérésének
# alap-beállítása; a modell szakasza és annak `meres.<f>` alszakasza felülírja (kulcsok: gondolkodas,
# gondolkodas_token, max_tokens_szorzo, repetition_penalty, repetition_context_size, temperature).
[meres]
ervenyes_kuszob = 0.10

# A szoveg kérése (ossz 1500, kartya 1800 token) a promptjához szűk: 6–10 állítás egyenként ≤ 40 szavas
# idézettel magyarul ~1500 token; a 2026-10-03-i mérésben a ministral3_3b 6/40 válasza hurok nélkül is
# levágódott (C18.1). A determinisztikus generálás miatt változatlan kerettel az újramérés ugyanazt adná.
[meres.feladat.szoveg]
max_tokens_szorzo = 1.5

# A kviz kérése (C22m; docs/C22M-TERV.md 3.): egy hívás 5 kérdést ad; a keretet a tétel adja (5 × [kviz] token_per_kerdes
# + 150 = 1300, a lánc élesen ugyanennyit kér), így nincs szorzó. A gondolkodó modelleknél a gondolkodás ki: a kvízlánc
# generáló hívása nem gondolkodik (a modell-szintű `gondolkodas` felülírhatja).
[meres.feladat.kviz]
gondolkodas = false

# J4: az asszisztens kijelölés-módjai interaktívak (a felhasználó vár a válaszra): a gondolkodó modell sem gondolkodik; az éles
# kérés ugyanezt a beállítást kapja (`kiegeszites_modell.general` → `eval.keres_beallitas`).
[meres.feladat.kifejtes]
gondolkodas = false

[meres.feladat.osszefoglal_kijeloles]
gondolkodas = false

# Ismétlés-büntetés a hosszú kézírás-OCR-re (K31, 2026-10-03; NAPLO C18.1): a könyvtár 20 tokenes ablakával
# 1.05–1.15 sem szüntette meg a sor-hurkot (qwen3_vl_4b 3/5); 64-es ablakkal 1.10 mellett 0/5 hurok (glm_ocr:
# 3 → 1). Az 1.15 nem jobb, egy glm-választ angol leírásba vitt; az enyhébb érték a képletek valódi ismétlését
# kevésbé torzítja. Az ocr_keplet (200 token, 0–1 hurok) büntetés nélkül marad.
[meres.feladat.ocr_kezi]
repetition_penalty = 1.10
repetition_context_size = 64

[meres.feladat.fuzet_fejezet]
repetition_penalty = 1.10
repetition_context_size = 64

# A füzetlánc forgatás-próbája (C21; nem router-feladat, a lánc a `fuzet_fejezet` modelljének küldi): ugyanaz a kézírás-olvasás
[meres.feladat.fuzet_forgatas]
repetition_penalty = 1.10
repetition_context_size = 64

# ------------------------------------------------------------------ modellregiszter (L30, C05)
