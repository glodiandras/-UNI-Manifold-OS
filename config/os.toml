vault_mappa = "Manifold - Videos"    # C20b: a gépi írás `mozgat` videó-profiljának egyetlen célmappája; a szállított alap a `[vault] kisero_elotag`-ot követi (core/kiserok.py)
tema_minta = ''                      # a téma-mappa neve (regex; a Bevitel „Célmappa (téma)” mezője és javaslatai). Üres: nincs téma-konvenció, a videó-bevitel témához kötése ki van kapcsolva. Ha van 2. csoport (kétjegyű sorszám), a `00` nem téma; az 1. csoport a tárgy-betű ([pdf.tags] kulcsa)
