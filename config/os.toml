kuszob = 0.3                         # „erősen módosult”: hosszal súlyozott mondathalmaz-Jaccard-távolság
min_hossz = 400                      # az új jegyzet legalább ennyi karakter
uj_karakter = 600                    # ennyi karakternyi új mondat már önmagában „erős” módosulás
