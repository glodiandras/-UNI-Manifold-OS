linker = "lld"                       # csak "lld" (az LLVM saját ld64.lld-je) él; a régi "rendszer" a fordító-profil alatt nem futhat (az exec csak az LLVM bin/-ből engedett), K168: figyelmen kívül marad, a doctor jelzi
fordit_idokorlat_s = 30.0
fordit_memoria_mb = 2048
fordit_munka_max_mb = 256             # a fordítás munka mappájába (forrás, objektum, bináris, ideiglenes) írható adat; egy fájlra RLIMIT_FSIZE is
fordit_munka_max_fajl = 1024
teszt_idokorlat_s = 2.0              # tesztenként, ha a `teszt` blokk nem ad sajátot
teszt_idokorlat_max_s = 10.0         # a `teszt` blokk idokorlat-ja ennél nem lehet több
hibakereso_idoszorzo = 3.0           # a sanitizeres futás lassabb: az időkorlát ennyiszeres
memoria_mb = 256                     # egy teszt csúcs-memóriája (a `teszt` blokk `--- memoria` szakasza felülírhatja)
teszt_memoria_max_mb = 1024          # a `--- memoria` szakasz ennél nem lehet több (C36a2)
lebego_eps = 1e-6                    # a `--- osszevetes` `lebego` módjának alap-tűrése (C36a2)
hibakereso_memoria_mb = 1024         # az ASan árnyékmemóriája miatt
kimenet_max_kb = 1024                # a stdout felső határa; fölötte ölés
stderr_max_kb = 64
munka_max_mb = 16                    # a program saját ideiglenes mappájába írható adat felső határa
munka_max_fajl = 256
mintavetel_ms = 20
formazas = "{BasedOnStyle: LLVM, IndentWidth: 4, ColumnLimit: 100, AllowShortFunctionsOnASingleLine: Inline}"
sablon = "C++ feladat"                # ha a sablonmappában van ilyen nevű .md, az a feladat-jegyzet váza (a beépített helyett)

# ------------------------------------------------------------------ F10: többnyelvű kód-munkafelület (core/kod_nyelvek.py, modulok/kod)
# A C++ és a C a fenti [cpp] szerint fut (változatlan); a többi nyelv profilja a core/kod_nyelvek.py-ban. Fordítás a
# modulok/kod/kod_fordit.sb, futtatás az értelmezett nyelveknél a kod_futtat.sb, a natívnál a C36a profil_futtat.sb alatt.
# Letöltés nincs (D3): a hiányzó eszközlánc érthető hiba (kod.nincs_eszkozlanc).
[kod]
fordit_idokorlat_s = 60.0            # a profil sajátja (Java 60, Go/Rust 90, Swift 120) ezt felülírja
fordit_memoria_mb = 4096
fordit_munka_max_mb = 512
fordit_munka_max_fajl = 4096
teszt_idokorlat_s = 2.0
teszt_idokorlat_max_s = 10.0
memoria_mb = 256                     # natív program (Go, Rust, Swift) egy tesztje
ertelmezo_memoria_mb = 512           # értelmezett / VM (Python, JS/TS, Java) egy tesztje, ha a blokk nem ad sajátot
teszt_memoria_max_mb = 1024
lebego_eps = 1e-6
kimenet_max_kb = 1024
stderr_max_kb = 64
munka_max_mb = 16
munka_max_fajl = 256
mintavetel_ms = 20
felderites_idokorlat_s = 15.0
proba_modell = ""                    # D9: kalibrált sor nélkül ez a regiszterbeli modell futhat, mindig „próba” jelöléssel (üres: a kalibrált `kod` modell próbaként)
extra_exec = []                      # további exec-gyökerek a fordító-profilnak (pl. egy indító-szkript héja); alapból üres

[kod.eszkozok]                       # gépenkénti eszközlánc-utak (a telepítési réteg állíthatja); üres: runtime, majd PATH
python = ""
node = ""
javac = ""
java = ""
go = ""
rustc = ""
cc = ""
swiftc = ""
sdk = ""

