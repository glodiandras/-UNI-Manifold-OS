# Manifold — model manifest (F6): the single registry of downloadable models, their tasks and calibration gates.
#
# Merged from the v2 `config/letoltes.toml` (C04) and the task/feature tables of the 5th audit (§3.4). Data only: the
# download runs as a background task, only on an explicit user request (D3); afterwards everything is offline. The runtime
# registry of the loader (`config/os.toml [modellek.*]`) stays in os.toml; a test keeps the two in sync (name, repo,
# revision, pattern, peak RAM, runner, conversion).
#
# Model fields ([modell.<id>]; the id is the key, Hungarian identifier without accents):
#   repo              source repository (Hugging Face; the only source type: [forras] tipus)
#   revizio           pinned commit sha (40 hex) — the integrity anchor: only this snapshot is downloaded and loaded;
#                     every file is verified after download (LFS: sha256 = blob name; other files: git blob sha1)
#   nyelvek           languages the model is meant for: ["*"] = multilingual / not restricted; ["hu"] = Hungarian only
#   szerep            main role: szoveg | kep (vision-language) | hang | beagyazas | rerank
#   ajanlott          recommended default (Model Manager "Recommended"); the v2 measurements' calibrated models
#   feladat           router tasks this model is a candidate for
#   minta             allow_patterns (when not the whole repository is needed)
#   meret_gb          download size per the HF API (2026-09-30), GB = 10^9 bytes; the size on disk is measured
#   csucs_gb          peak RAM (measured where csucs_mert = true, otherwise estimated: 1.1 × weights + 0.8 GB)
#   keret             munka (≤ 5 GB) | tavol (≤ 9 GB)
#   futtato           loader backend (mlx-lm | mlx-vlm | mlx-whisper | mlx-audio | transformers | sentence-transformers | …)
#   konvertalas       true: not MLX format; needs a local conversion after download (not loadable until then)
#   licenc            per the model card
#   kor               elso (first round) | opcionalis (CLI groups: `mos models pull elso|opcionalis|mind`)

[forras]
tipus = "huggingface"
vegpont = "https://huggingface.co"
# Hosts the download may contact (HTTPS only; the request hook rejects every other host, including redirects).
# "*.x" matches any subdomain of x. Xet transfer is disabled for the download step so every request goes through this check.
hostok = ["huggingface.co", "*.huggingface.co", "*.hf.co"]

# ------------------------------------------------------------------ tasks (router tasks): English title and description
[feladat.ocr_kezi]
cim = "Handwriting recognition"
leiras = "Transcribes handwritten notebook pages for search."
[feladat.ocr_keplet]
cim = "Formula recognition"
leiras = "Turns a cropped formula image into LaTeX."
[feladat.atirat]
cim = "Speech to text"
leiras = "Transcribes video audio when there are no subtitles."
[feladat.szoveg]
cim = "Text understanding"
leiras = "Summaries, cards and answers from your notes."
[feladat.kviz]
cim = "Quiz generation"
leiras = "Five-question multiple-choice quizzes from a note."
[feladat.matek]
cim = "Math reasoning"
leiras = "Step-by-step solution with a final result."
[feladat.matek_cas]
cim = "Math solver"
leiras = "Writes SymPy code that solves the exercise in a sandbox."
[feladat.matek_ellenorzo]
cim = "Derivation checker"
leiras = "Finds the first wrong line of a derivation."
[feladat.beagyazas]
cim = "Embeddings"
leiras = "Vectors for meaning-based search and similar notes."
[feladat.rerank]
cim = "Reranking"
leiras = "Reorders search results by meaning."
[feladat.osztalyozas]
cim = "Classification"
leiras = "Classifies free-text requests (no feature uses it yet)."
[feladat.fuzet_fejezet]
cim = "Notebook chapter"
leiras = "Assigns a notebook photo to a subject and chapter."
[feladat.fuzet_valaszto]
cim = "Notebook note choice"
leiras = "Chooses the note a notebook photo belongs to."
[feladat.kod]
cim = "Code assistant"
leiras = "Explains bugs, gives hints and writes tests for code."
[feladat.grafikon]
cim = "Graph features"
leiras = "Reads zeros, extrema and asymptotes from a formula."
[feladat.tema]
cim = "Video topic"
leiras = "Matches a video to a topic of your notes."
[feladat.kotes]
cim = "Video link"
leiras = "Decides whether a video explains a note."
[feladat.kiegeszites]
cim = "Text completion"
leiras = "Continues the sentence you are typing."
[feladat.kifejtes]
cim = "Explain selection"
leiras = "Explains the selected text in more detail."
[feladat.osszefoglal_kijeloles]
cim = "Summarize selection"
leiras = "Summarizes the selected text in one or two sentences."

# ------------------------------------------------------------------ features → tasks (the Model Manager's "needed for")
[funkcio.kereses_jelentes]
cim = "Search by meaning"
feladatok = ["beagyazas", "rerank"]
[funkcio.kerdezz]
cim = "Ask your workspace"
feladatok = ["szoveg", "beagyazas"]
[funkcio.kartya]
