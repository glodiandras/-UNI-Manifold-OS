feladatok = ["szoveg"]

# ------------------------------------------------------------------ calibration gates
# The thresholds live in code (core/modell/kuszob.py, enforced by eval.rogzit and "Test this model"); the values here can
# only make a gate stricter (higher kuszob, larger min_tetel), never weaker. A task without a threshold in code cannot get
# the calibrated signal until a measured threshold is added there.
[kalibracio.ocr_keplet]
kuszob = 0.90
min_tetel = 20
[kalibracio.ocr_kezi]
kuszob = 0.60
min_tetel = 20
[kalibracio.szoveg]
kuszob = 0.40
min_tetel = 20
[kalibracio.kviz]
kuszob = 0.40
min_tetel = 20
[kalibracio.matek]
kuszob = 0.75
min_tetel = 20
[kalibracio.matek_cas]
kuszob = 0.75
min_tetel = 20
[kalibracio.matek_ellenorzo]
kuszob = 0.80
min_tetel = 20
[kalibracio.grafikon]
kuszob = 0.75
min_tetel = 15
[kalibracio.kod]
kuszob = 0.60
min_tetel = 20
[kalibracio.kiegeszites]
kuszob = 0.70
min_tetel = 12
[kalibracio.kifejtes]
kuszob = 0.70
min_tetel = 12
[kalibracio.osszefoglal_kijeloles]
kuszob = 0.70
min_tetel = 12

